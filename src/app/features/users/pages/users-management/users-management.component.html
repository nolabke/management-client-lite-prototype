
<div class=" m-2 ">

  <mat-form-field class="search-field" color="primary">
    <input matInput type="search" placeholder="Suche nach..." (input)="onSearchTermChange($event)"/>
    
    
  </mat-form-field>

  <mat-table [dataSource]="dataSource.data | searchFilter : searchTerm" matSort>

    <ng-container matColumnDef="Id">
      <mat-header-cell *matHeaderCellDef mat-sort-header> ID </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{user.Id}} </mat-cell>
    </ng-container>
    
    <ng-container matColumnDef="FirstName">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Vorname </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{user.FirstName}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="LastName">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Nachname </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{user.LastName}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="UserName">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Benutzername </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{user.UserName}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="IsAdmin">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Berechtigungen </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{user.IsAdmin ? 'Admin' : ''}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="IsDisabled">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Gespärt </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{user.IsDisables ? 'Ja' : 'Nein'}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="LastLogin">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Letzte Anmeldung </mat-header-cell>
      <mat-cell *matCellDef="let user"> {{user.LastLogin | date:'dd.MM.yyyy HH:mm'}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="Actions">
  <mat-header-cell *matHeaderCellDef></mat-header-cell>

  <mat-cell *matCellDef="let user" style="display: flex; justify-content: flex-end;">

      <a routerLink="/edit-user"  [queryParams]="{user: user  | json }">
        <button mat-stroked-button color="primary">

          <mat-icon >edit</mat-icon> Bearbeiten
        </button>
        </a>

  </mat-cell>
</ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>

  <div class="footer">
    <mat-paginator [pageSizeOptions]="[20, 30, 50, dataSource.data.length]"
        showFirstLastButtons
        aria-label="Select page of users">
    </mat-paginator>
  </div>
</div>


<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <mat-icon class="login-header-icon">roofing</mat-icon>
      <h1>Willkommen</h1>
      <p class="login-subtitle">Dachdeckerei Mobile App</p>
    </div>

    <mat-divider></mat-divider>

    <p class="login-hint">Mit Dachdeckerei-Konto anmelden</p>

    <mat-form-field class="w-full">
      <mat-label>Name</mat-label>
      <input matInput type="text" id="username" name="username" [(ngModel)]="loginDTO.username" (keyup.enter)="login()">
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Passwort</mat-label>
      <input matInput type="password" id="password" name="password" [(ngModel)]="loginDTO.password" (keyup.enter)="login()">
    </mat-form-field>

    <p class="login-error" *ngIf="errorMessage" [innerHtml]="errorMessage"></p>

    <button mat-flat-button color="primary" class="login-button" (click)="login()">Anmelden</button>

  </div>
</div>

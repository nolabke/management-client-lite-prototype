
<div class="server-page">
  <div class="server-card">

    <div class="server-header">
      <mat-icon class="server-header-icon">dns</mat-icon>
      <div>
        <h2>Serverkonfiguration</h2>
        <p class="server-subtitle">Verbindung zum Dachdeckerei-Server einrichten</p>
      </div>
    </div>

    <mat-form-field class="w-full">
      <mat-label>Serveradresse eingeben</mat-label>
      <input matInput id="serverAddress" name="serverAddress"
             [disabled]="isConnecting"
             [(ngModel)]="serverAddress"
             (keyup.enter)="connectToDachServer()">
    </mat-form-field>

    <p class="server-error" *ngIf="errorMessage" [innerHtml]="errorMessage"></p>

    <!-- A cold-started free-tier server can take up to ~30s to answer (see
         server-connection.service.ts's retry) - without this the button
         just looks unresponsive for that whole time. -->
    <mat-progress-bar *ngIf="isConnecting" mode="indeterminate" color="primary"></mat-progress-bar>
    <p class="server-subtitle" *ngIf="isConnecting">Verbindung wird geprüft... (kann bei einem „eingeschlafenen" Gratis-Server bis zu 30 Sekunden dauern)</p>

    <button mat-flat-button color="primary" class="server-button"
            [disabled]="isConnecting"
            (click)="connectToDachServer()">Überprüfen</button>

  </div>
</div>

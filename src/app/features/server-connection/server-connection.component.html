    <div class="container px-5 py-24 mx-auto flex flex-wrap items-center">
      <div class="lg:w-2/3 md:w-2/2 bg-white rounded-lg p-8 flex flex-col md:ml-auto w-full mt-10 md:mt-0 relative z-10 shadow-md">
        <h5 class="text-gray-900 text-lg mb-1 font-medium title-font">Serverkonfiguration</h5>
        <div class="relative mb-4">
            <label for="serverAddress" class="leading-7 text-sm text-gray-600">Serveradresse eingeben</label>
            <input matInput id="serverAddress" name="serverAddress"
                  [(ngModel)]="serverAddress" 
                  class="w-full bg-white rounded border border-gray-300 focus:border-green-500 focus:ring-2 focus:ring-green-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out"   
                  >
        </div>

        <p class="text-xs text-gray-500 mt-3" [innerHtml]="errorMessage"></p>
        <div (click)="connectToDachServer()">
          <button class="text-white bg-green-500 border-0 py-2 px-6 focus:outline-none hover:bg-green-600 rounded text-lg" 
          >Überprüfen</button>
        </div>
     </div>
    </div>
  </section>

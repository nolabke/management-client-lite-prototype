<div class="dialog-page">

  <mat-form-field>
    <mat-label>Projektnummer</mat-label>
    <input matInput type="text" [(ngModel)]="project.ProjectNo" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Kundenname</mat-label>
    <input matInput type="text" [(ngModel)]="project.Name" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Strasse</mat-label>
    <input matInput type="text" id="street" name="street" [(ngModel)]="project.Street" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>PLZ</mat-label>
    <input matInput type="text" id="zip" name="zip" [(ngModel)]="project.Zip" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Stadt</mat-label>
    <input matInput type="text" id="city" name="city" [(ngModel)]="project.City" />
  </mat-form-field>

</div>

<div class="footer">
  <div class="footer-danger"></div>

  <div class="footer-actions">
    <button mat-stroked-button type="button" routerLink="/baustellenverwaltung">Abbrechen</button>
    <button mat-flat-button color="primary" type="button" [disabled]="isProjectInvalid" (click)="addProject()">Speichern</button>
  </div>
</div>

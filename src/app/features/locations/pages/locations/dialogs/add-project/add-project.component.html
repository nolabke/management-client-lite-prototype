<div class="addProject">
  <div class="m-24">

      <mat-form-field class="mb-4 w-full">
        <label>Projektnummer</label>
        <input matInput type="text" [(ngModel)]="project.ProjectNo" />
      </mat-form-field>  
      
      <mat-form-field class="mb-4 w-full">
        <label >Kundenname</label>
        <input matInput type="text" [(ngModel)]="project.Name" 
              class="bg-white rounded border border-gray-300 w-60" />
      </mat-form-field>

      <mat-form-field class="mb-4 w-full">
        <label >Strasse</label>
        <input matInput type="text" id="street" name="street" [(ngModel)]="project.Street" 
            class="bg-white rounded border border-gray-300 w-40" />
      </mat-form-field>
        
      <mat-form-field class="mb-4 w-full">
        <label >PLZ</label>
        <input matInput type="text" id="zip" name="zip" [(ngModel)]="project.Zip" 
            class="bg-white rounded border border-gray-300 w-40"/>
      </mat-form-field>
        
      <mat-form-field class="mb-4 w-full">
        <label >Stadt</label>
        <input matInput type="text" id="city" name="city" [(ngModel)]="project.City" 
            class="bg-white rounded border border-gray-300 w-40"/>
      </mat-form-field>
  
    <!--
        <mat-form-field>
        <label >Projektzustand</label>
        <p></p>
        <mat-checkbox id="status" name="status" formControlName="projectStatus" [(ngModel)]="project.IsDisabled"></mat-checkbox>
      </mat-form-field>
    -->
    <p></p>
        
    
    </div> 



  <div class="footer">

    <div class="py-4 mx-2">
      <p> </p>
    </div>

    <div id="buttons">
      <button mat-stroked-button class="shadow-s text-white bg-green-500 px-4 py-2 rounded hover:opacity-70 rounded ring ring-transparent m-1" routerLink="/baustellenverwaltung">Schliessen</button>
      <button type="submit" mat-flat-button class="shadow-s text-white bg-green-500 px-4 py-2 rounded hover:opacity-70 rounded ring ring-transparent m-1" routerLink="/baustellenverwaltung">Speichern</button>

    </div> 
  </div>
</div>

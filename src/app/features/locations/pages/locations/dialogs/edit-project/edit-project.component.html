<div class="dialog-page">

  <mat-form-field>
    <mat-label>Projektnummer</mat-label>
    <input matInput type="text" [(ngModel)]="project.ProjectNo"/>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Kundenname</mat-label>
    <input matInput type="text" [(ngModel)]="project.Name" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Strasse</mat-label>
    <input matInput type="text" [(ngModel)]="project.Street" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>PLZ</mat-label>
    <input matInput type="text" [(ngModel)]="project.Zip" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Stadt</mat-label>
    <input matInput type="text" [(ngModel)]="project.City" />
  </mat-form-field>

  <!--TODO: Remove additional info about last number of files that was picked-->
  <div *ngIf="project.Images?.length">
    <mat-list>
      <mat-list-item *ngFor="let image of project.Images">
        {{ image.Id }}. {{image && image.FileName ? image.FileName.substring(image.FileName.lastIndexOf('\\') + 1) : ''}}
        <button mat-icon-button (click)="removeImageFileFromList(image.Id)" aria-label="Bild entfernen">
          <mat-icon class="danger-icon">delete</mat-icon>
        </button>
      </mat-list-item>
    </mat-list>
  </div>

</div>

<div class="footer">
  <div class="footer-danger">
    <button type="button" class="danger-link" (click)="deleteProject()">
      <mat-icon>delete</mat-icon>
      Projekt entfernen
    </button>
  </div>

  <div class="footer-actions">
    <button mat-stroked-button type="button" routerLink="/baustellenverwaltung">Abbrechen</button>
    <button mat-flat-button color="primary" type="button" [disabled]="isProjectInvalid" (click)="updateProject()">Speichern</button>
  </div>
</div>

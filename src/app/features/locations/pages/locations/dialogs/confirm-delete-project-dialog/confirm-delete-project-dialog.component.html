<div class="dialog">
    <h2 mat-dialog-title>Projekt löschen</h2>
    <mat-dialog-content>Bist du sicher, dass du das Projekt entfernen möchtest?'

    </mat-dialog-content>

    <div id="buttons" class="py-4 mx-2">
        <button mat-stroked-button class="py-4 mx-2" style="justify-self: left;" (click)="close()">Nein</button>
        <button mat-flat-button class="py-4 mx-2" style="justify-self: right; background-color: crimson;"  (click)="deleteProject()">Ja</button>
    </div>

</div>

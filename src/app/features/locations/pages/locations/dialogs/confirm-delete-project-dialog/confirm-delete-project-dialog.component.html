<h2 mat-dialog-title>Projekt löschen</h2>

<mat-dialog-content>
  {{ data?.message || 'Bist du sicher, dass du dieses Projekt entfernen möchtest?' }}
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="close()">Abbrechen</button>
  <button mat-flat-button color="warn" type="button" (click)="deleteProject()">Löschen</button>
</mat-dialog-actions>

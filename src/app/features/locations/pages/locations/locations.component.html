<div class=" m-2 p-2 table-page-container">

  <mat-form-field class="search-field" color="primary">
    <input matInput type="search" placeholder="Suche nach..." (input)="onSearchTermChange($event)" />
  </mat-form-field>

  <mat-paginator [pageSizeOptions]="[20, 30, 50, dataSource.data.length]"
    showFirstLastButtons
    aria-label="Select page of projects">
  </mat-paginator>

  <mat-table [dataSource]="dataSource" matSort class="table">
<!--
    <ng-container matColumnDef="Id">
      <mat-header-cell *matHeaderCellDef mat-sort-header> ID </mat-header-cell>
      <mat-cell *matCellDef="let project"> {{project.Id}} </mat-cell>
    </ng-container>
-->    
    <ng-container matColumnDef="ProjectNo">
      <mat-header-cell *matHeaderCellDef mat-sort-header>Projekt</mat-header-cell>
      <mat-cell *matCellDef="let project"> {{project.ProjectNo}} </mat-cell>
    </ng-container>
  
    <ng-container matColumnDef="Name">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Kunde </mat-header-cell>
      <mat-cell *matCellDef="let project"> {{project.Name}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="Street">
        <mat-header-cell *matHeaderCellDef mat-sort-header> Addresse </mat-header-cell>
        <mat-cell *matCellDef="let project"> {{project.Street}} </mat-cell>
      </ng-container>
    
    <ng-container matColumnDef="City">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Stadt </mat-header-cell>
      <mat-cell *matCellDef="let project"> {{project.City}} </mat-cell>
    </ng-container>
  
    <ng-container matColumnDef="Zip">
      <mat-header-cell *matHeaderCellDef mat-sort-header> PLZ </mat-header-cell>
      <mat-cell *matCellDef="let project"> {{project.Zip}} </mat-cell>
    </ng-container>

    <!-- Tablet/smartphone only: Kunde, Adresse, PLZ and Stadt merged into
         one column, shown on three lines (Kunde / Adresse / PLZ Stadt). -->
    <ng-container matColumnDef="Location">
      <mat-header-cell *matHeaderCellDef> Kunde </mat-header-cell>
      <mat-cell *matCellDef="let project">
        <div class="contact-stack">
          <span>{{project.Name}}</span>
          <span>{{project.Street}}</span>
          <span>{{project.Zip}} {{project.City}}</span>
        </div>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="IsDisabled">
        <mat-header-cell *matHeaderCellDef mat-sort-header> Zustand </mat-header-cell>
        <mat-cell *matCellDef="let project" [title]="project.IsDisabled ? 'Abgeschlossen' : 'Nicht abgeschlossen'">
          <mat-icon class="status-icon" [class.status-done]="project.IsDisabled" [class.status-progress]="!project.IsDisabled">
            {{ project.IsDisabled ? 'check_circle' : 'hourglass_empty' }}
          </mat-icon>
        </mat-cell>
      </ng-container>

    <ng-container matColumnDef="editBtn">
      <mat-header-cell *matHeaderCellDef style="display: flex; justify-content: flex-end;">
        <button mat-flat-button routerLink="/add-project">
          <mat-icon >add</mat-icon><span class="btn-label">Neue Baustelle</span>
        </button>
      </mat-header-cell>
      <mat-cell *matCellDef="let project" style="display: flex; justify-content: flex-end;">
        <a routerLink="/edit-project"
        [queryParams]="{project: project  | json }">

        <button mat-stroked-button color="primary">
          <mat-icon >edit</mat-icon><span class="btn-label"> Bearbeiten</span>
        </button>
          
        </a>
      </mat-cell>
    </ng-container>
  
    <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" ></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;" ></mat-row>
    
  </mat-table>
</div>

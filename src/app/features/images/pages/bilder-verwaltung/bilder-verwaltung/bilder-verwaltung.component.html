<div class=" m-5 table-page-container">

<mat-form-field class="search-field" color="primary">
  <mat-label>Suche</mat-label>
  <input matInput type="search" placeholder="_user.jpg" (input)="onSearchTermChange($event)" />
  
</mat-form-field>
<button mat-flat-button color="primary"
          (click)="syncImages()">Synchroniziere
</button>

<mat-paginator [pageSizeOptions]="[20, 30, 50]"
  showFirstLastButtons
  aria-label="Select page of images">
</mat-paginator>

<mat-table [dataSource]="dataSource" matSort>

    <!-- No mat-sort-header here on purpose - "selected" isn't a sortable
         data property, and mat-sort-header wraps its content in Material's
         sort-header container/content/arrow markup (built for a text label
         + sort arrow), which just crammed the checkbox into extra nested
         elements it didn't need and threw off its centering. -->
    <ng-container matColumnDef="select" >
      <mat-header-cell *matHeaderCellDef>
        <mat-checkbox color="success"
          (change)="toggleAllRows($event.checked)" 
          [checked]="isAllSelected()" 
          [indeterminate]="isIndeterminate()">
        </mat-checkbox>
      </mat-header-cell>
      <mat-cell *matCellDef="let image">
        <mat-checkbox [checked]="isRowSelected(image.Id)" (change)="selectionChanged(image)"></mat-checkbox>
      </mat-cell>
    </ng-container>
    <ng-container matColumnDef="FileName">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Speicherort </mat-header-cell>
      <mat-cell *matCellDef="let image"> {{image.FileName}} </mat-cell>
    </ng-container>

    <ng-container matColumnDef="UploadDate">
        <mat-header-cell *matHeaderCellDef mat-sort-header> Gespeichert am </mat-header-cell>
        <mat-cell *matCellDef="let image"> {{image.UploadDate | date: 'dd.MM.yyyy HH:mm'}} </mat-cell>
      </ng-container>

    <!-- Baustellennummer + Baustelle merged into one column - number on
         top (the primary identifier), name underneath. Replaces the old
         separate 'ProjectNo'/'Name' columns. -->
    <ng-container matColumnDef="Baustelle">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Baustelle </mat-header-cell>
      <mat-cell *matCellDef="let image">
        <div class="baustelle-cell">
          <span class="baustelle-nr">{{image.Location?.ProjectNo}}</span>
          <span class="baustelle-name">{{image.Location?.Name}}</span>
        </div>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="UserName">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Mitarbeiter_in </mat-header-cell>
      <mat-cell *matCellDef="let image"> {{image.User.Name}} </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    
  </mat-table>

</div>

<div class="">
 <div>
            <div class=" centered-elements">
                <div class="p-4 ">
                    <mat-form-field >
                        <label >Baustellenummer</label>
                        <input matInput type="text" [(ngModel)]="projectNo" />
                    </mat-form-field>
                </div>

                <div routerLink="/qrscanner" class="p-4 large-icon">
                    <mat-icon >qr_code_scanner</mat-icon>
                </div>
            </div>

            <br/>

            <div class="upload-actions">
                <button mat-stroked-button type="button">
                    <input type="file" id="fileInput" multiple (change)="onFileSelected($event)" accept="image/jpeg, image/png"/>
                    <label for="fileInput" >Bilder auswählen</label>
                </button>
                <button #uploadBtn mat-flat-button color="primary"
                    [disabled]="!canUpload"
                    (click)="uploadImages()">Bilder hochladen</button>
            </div>
            <div class="flex-column justify-center">

                <mat-progress-bar *ngIf="isProgressbarActivated" color="primary"  mode="buffer" [value]="uploadProgress"></mat-progress-bar>

            </div>

            <br/>
            <div class="mb-40 thumbnails-grid">
                <!--TODO: Remove additional info about last number of files that was picked -->
                <div class="thumbnail-item" *ngFor="let image of imagesAsDataUrl; let i = index" >
                    <div class="fileUploadContainer" appearance="fill">
                        <img [src]="image" class="thumbnail p-2" alt="Image {{i}}"/>
                        <button type="button" class="deleteButton"
                            matTooltip="Bild entfernen"
                            (click)="removeImageFileFromList(i)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </div>
                </div>
            </div>
 </div>
</div>
